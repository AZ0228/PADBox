[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "padbox"
version = "0.1.0"
description = "Local-first, review-first PAD collection importer"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.10,<5",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "streamlit>=1.42,<2",
]

[project.scripts]
padbox = "padbox.cli:app"

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
